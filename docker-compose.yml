version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: rotation-db
    environment:
      POSTGRES_USER: rotation_user
      POSTGRES_PASSWORD: rotation_password
      POSTGRES_DB: rotation_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
