spring.application.name=Rotation

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/rotation_db
spring.datasource.username=rotation_user
spring.datasource.password=rotation_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
# Flyway kullandığımız için tablo oluşturma işini ona bırakıyoruz (validate sadece kontrol eder).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
